# Reverse-proxy the Panda launcher behind your existing domain.
# The launcher listens on 127.0.0.1:8600 (see panda-launcher.service).

# ── Option A: SUBPATH under the existing dev.om.mvnoc.ai server block ──────────
# Add this `location` inside the existing `server { server_name dev.om.mvnoc.ai; ... }`.
# Requires uvicorn --root-path /panda (already set in the systemd unit) so the
# artifact URLs the launcher emits are correct.
#
#   location /panda/ {
#       proxy_pass http://127.0.0.1:8600/;
#       proxy_set_header Host $host;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto https;
#       proxy_read_timeout 600s;          # agent runs can be long
#       client_max_body_size 200m;        # user-uploaded stills
#   }
#
#   => Dify BASE_URL = https://dev.om.mvnoc.ai/panda

# ── Option B: dedicated SUBDOMAIN (cleaner; no --root-path needed) ─────────────
server {
    listen 443 ssl;
    server_name panda.om.mvnoc.ai;

    # ssl_certificate ... ;            # reuse your existing cert/wildcard
    # ssl_certificate_key ... ;

    location / {
        proxy_pass http://127.0.0.1:8600;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        client_max_body_size 200m;
    }

    # => Dify BASE_URL = https://panda.om.mvnoc.ai
    # (and REMOVE --root-path /panda from panda-launcher.service)
}
