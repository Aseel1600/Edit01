# NVIDIA vLLM — phase 1 default: 2 GPUs (H100 80GB).
# Phase 2: TENSOR_PARALLEL_SIZE=8 on an 8-GPU node.
# Requires NVIDIA Container Toolkit. Do not run this on the Hostinger VPS.

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    ipc: host
    restart: unless-stopped
    ports:
      - "${VLLM_PORT:-8000}:8000"
    env_file:
      - ../env/inference-nvidia.env.example
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface:/root/.cache/huggingface
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen3-30B-A3B-Instruct}
      - --served-model-name
      - ${VLLM_SERVED_NAME:-qwen3-30b-a3b}
      - --tensor-parallel-size
      - ${TENSOR_PARALLEL_SIZE:-2}
      - --max-model-len
      - ${MAX_MODEL_LEN:-32768}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.90}
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --trust-remote-code
      - --api-key
      - ${INFERENCE_API_KEY:-changeme}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  huggingface:
